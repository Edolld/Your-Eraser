name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        run: bash gen.sh

      - name: Download MI-GAN model
        run: |
          curl -L --fail -o proj/app/src/main/assets/migan_pipeline_v2.onnx https://huggingface.co/CardAnvilModels/MI-GAN-ONNX/resolve/main/migan_pipeline_v2.onnx
          ls -l proj/app/src/main/assets

      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: YourEraser-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk YourEraser.apk
          gh release create "v${{ github.run_number }}.${{ github.run_attempt }}" YourEraser.apk --target "${{ github.sha }}" --title "Your Eraser ${{ github.run_number }}" --notes "Install YourEraser.apk"
          
